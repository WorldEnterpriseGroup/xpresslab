<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XpressLab Business Classification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      background-color: #fff;
      border-radius: 8px;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #2a7ae2;
    }
    .code-section {
      margin-top: 20px;
    }
    .code-title {
      font-weight: bold;
      margin-bottom: 5px;
      color: #444;
    }
    .code-value {
      background-color: #eaeaea;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>XpressLab Business Classification</h1>

    <div class="code-section">
      <div class="code-title">NAICS Code:</div>
      <div class="code-value">541511 – Custom Computer Programming Services</div>
    </div>

    <div class="code-section">
      <div class="code-title">SIC Code:</div>
      <div class="code-value">7371 – Computer Programming Services</div>
    </div>

    <div class="code-section">
      <div class="code-title">PSC Code:</div>
      <div class="code-value">D302 – IT and Telecom – Systems Development</div>
    </div>

    <div class="code-section">
      <div class="code-title">SIN Code:</div>
      <div class="code-value">132-51 – Information Technology Professional Services</div>
    </div>
  </div>
</body>
</html>
